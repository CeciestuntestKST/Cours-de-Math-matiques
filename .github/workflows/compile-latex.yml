name: Build LaTeX PDFs and Commit

# ==============================================================
#  DOSSIERS À COMPILER
#  C'est ICI que tu ajoutes ou retires un dossier.
#  Sépare les noms par des virgules, sans espaces.
#  Exemple : DOSSIERS: "L3,M1,M2,developpements,lecons"
# ==============================================================
env:
  DOSSIERS: "Dossier_Test"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1 : transforme la liste DOSSIERS en matrice de jobs
  preparer:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Transformer la liste en matrice
        id: set
        run: |
          echo "matrix=$(printf '%s' "$DOSSIERS" | jq -Rsc 'split(",") | map(gsub("^ +| +$";"")) | {dossier: .}')" >> "$GITHUB_OUTPUT"

  # Job 2 : lance en parallèle un job de compilation par dossier de la liste
  compiler:
    needs: preparer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preparer.outputs.matrix) }}
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Compiler les cours du dossier ${{ matrix.dossier }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          working_directory: ${{ matrix.dossier }}
          work_in_root_file_dir: true

      - name: Ranger les PDF pour l'upload (en conservant le nom du dossier)
        run: |
          mkdir -p out
          cp -r ${{ matrix.dossier }} out/
          rm out/${{ matrix.dossier }}/*.tex

      - name: Sauvegarder les PDF compilés
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.dossier }}
          path: out

  # Job 3 : télécharge tous les PDF et les committe en une seule fois
  committer:
    needs: compiler
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Télécharger tous les PDF compilés
        uses: actions/download-artifact@v4
        with:
          pattern: pdf-*
          path: .
          merge-multiple: true

      - name: Lister les PDF reçus (diagnostic)
        run: find . -name "*.pdf" -not -path "./.git/*"

      - name: Commiter et pousser les PDF générés par GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build PDF [skip ci]"
          file_pattern: "**/*.pdf"
          add_options: '-f'           # le '-f' permet de commiter les PDF malgré le .gitignore
          skip_dirty_check: true      # indispensable : les PDF sont ignorés, donc "git status" ne les voit pas
