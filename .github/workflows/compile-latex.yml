name: Build LaTeX PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Compiler les documents LaTeX des dossiers spécifiés
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            L3/*.tex
            M1/*.tex
            M2/*.tex
          work_in_root_file_dir: false

      - name: Sauvegarder tous les PDF générés
        uses: actions/upload-artifact@v4
        with:
          name: Tous-les-Cours-PDF
          path: "**/*.pdf"
