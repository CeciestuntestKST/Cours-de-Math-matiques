name: Build All LaTeX PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Compiler tous les documents LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex" # Compile tous les fichiers .tex trouvés à la racine

      - name: Sauvegarder tous les PDF générés
        uses: actions/upload-artifact@v4
        with:
          name: Tous-les-Cours-PDF
          path: "*.pdf"   # Sauvegarde tous les fichiers PDF produits
