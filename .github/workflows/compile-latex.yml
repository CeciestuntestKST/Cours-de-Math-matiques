name: Build LaTeX PDFs and Commit

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex_l3:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Compiler les cours du dossier L3
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          working_directory: L3
          work_in_root_file_dir: true

      - name: Commiter et pousser le PDF généré par GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build PDF [skip ci]"
          file_pattern: "L3/*.pdf"
          add_options: '-f'  # 👈 Le '-f' (force) permet à GitHub de commiter le PDF même s'il est dans .gitignore
